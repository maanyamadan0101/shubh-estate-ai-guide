name: SEO PR QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint SEO-changed TypeScript files
        id: lint
        shell: bash
        run: |
          set +e
          bunx eslint \
            src/lib/seo.ts \
            src/routes/about.tsx \
            src/routes/best-areas-gurgaon-property-investment.tsx \
            src/routes/contact.tsx \
            src/routes/dwarka-expressway-flats-for-sale-gurgaon.tsx \
            'src/routes/locations.$slug.tsx' \
            'src/routes/projects.$slug.tsx' \
            src/routes/property-buying-advisory-gurgaon.tsx \
            'src/routes/property.$slug.tsx' \
            src/routes/rent-out-property-in-gurgaon.tsx \
            src/routes/sell-property-gurgaon.tsx \
            'src/routes/sitemap[.]xml.ts' \
            src/routes/godrej-101-sector-79-gurgaon.tsx \
            src/routes/property-sector-79-gurgaon.tsx \
            src/routes/home-loans.tsx > lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: TypeScript
        id: typescript
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit > typescript.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Production build
        id: build
        shell: bash
        run: |
          set +e
          bun run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish QA diagnostics to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-18000) : '(no output)';
            const body = [
              '## SEO PR QA diagnostics',
              '',
              `Changed-file ESLint exit: ${{ steps.lint.outputs.exit_code }}`,
              `TypeScript exit: ${{ steps.typescript.outputs.exit_code }}`,
              `Production build exit: ${{ steps.build.outputs.exit_code }}`,
              '',
              '<details><summary>Changed-file ESLint</summary>',
              '',
              '```text', read('lint.log'), '```',
              '</details>',
              '',
              '<details><summary>TypeScript</summary>',
              '',
              '```text', read('typescript.log'), '```',
              '</details>',
              '',
              '<details><summary>Build tail</summary>',
              '',
              '```text', read('build.log').slice(-6000), '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Enforce QA result
        if: always()
        shell: bash
        run: |
          test "${{ steps.lint.outputs.exit_code }}" = "0"
          test "${{ steps.typescript.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
